name: CI

# Typecheck and test on every pull request and every push to main.
# Vercel's build skips type checking (web/next.config.ts ignoreBuildErrors),
# so this is the check that catches type errors before they ship.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install (root)
        run: npm ci --no-audit --no-fund
      - name: Typecheck (src)
        run: npm run typecheck
      - name: Tests
        run: npm test

      - name: Install (web)
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Typecheck (web)
        run: npx tsc --noEmit
        working-directory: web
