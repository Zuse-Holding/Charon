<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 160" width="580" height="160">

  <!-- Pill border -->
  <rect x="72" y="18" width="436" height="112" rx="56" ry="56"
    fill="none" stroke="#DDE8FF" stroke-width="6"/>

  <!-- Custom letterforms — stroke-based, geometric, mono-weight -->
  <g stroke="#DDE8FF" stroke-width="9" fill="none"
     stroke-linecap="butt" stroke-linejoin="miter">

    <!-- Z  (center x=193) -->
    <g transform="translate(193,74)">
      <line x1="-24" y1="-34" x2="24" y2="-34"/>
      <line x1="24"  y1="-34" x2="-24" y2="34"/>
      <line x1="-24" y1="34"  x2="24"  y2="34"/>
    </g>

    <!-- U  (center x=263) -->
    <g transform="translate(263,74)" stroke-linejoin="round">
      <path d="M -24,-34 V 12 Q -24,34 0,34 Q 24,34 24,12 V -34"/>
    </g>

    <!-- S  (center x=330) -->
    <g transform="translate(330,74)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 20,-20 C 20,-38 -20,-38 -20,-20
               C -20,-6 20,6 20,20
               C 20,38 -20,38 -20,20"/>
    </g>

    <!-- E  (center x=395) -->
    <g transform="translate(395,74)">
      <line x1="-22" y1="-34" x2="-22" y2="34"/>
      <line x1="-22" y1="-34" x2="22"  y2="-34"/>
      <line x1="-22" y1="0"   x2="14"  y2="0"/>
      <line x1="-22" y1="34"  x2="22"  y2="34"/>
    </g>

  </g>

  <!-- HOLDINGS below pill -->
  <text x="290" y="152"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="10.5" font-weight="400"
    fill="#DDE8FF" letter-spacing="16" opacity="0.45">HOLDINGS</text>
</svg>
